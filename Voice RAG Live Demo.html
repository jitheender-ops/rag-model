document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

03, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d2a6309d-3012-4951-b55a-085a5e7a6738\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"695bf705-a32b-490d-aaa2-785ad6e335e6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: var(--color-bg); overflow-x: hidden; }\n  a { color: var(--color-accent-700); text-decoration: none; border-bottom: 1px solid var(--color-accent-300); }\n  a:hover { color: var(--color-accent); border-bottom-color: var(--color-accent); }\n  @keyframes vragPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }\n  @keyframes vragBlink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }\n  .vrag-label { position: absolute; transform: translate(-50%,-100%); pointer-events: none; white-space: nowrap; font-family: var(--font-heading); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1320px;margin:0 auto;padding:0 32px 80px;font-family:var(--font-body);color:var(--color-text)\">\n\n  <header style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:28px 0 18px;border-bottom:2px solid var(--color-divider)\">\n    <div>\n      <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-accent-700)\">HH Goa 2026 · Task 2<\u002Fdiv>\n      <h1 style=\"font-size:38px;line-height:1;letter-spacing:-.025em;margin:10px 0 0\">Voice-enabled RAG<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <div style=\"width:9px;height:9px;background:{{ statusDot }}\"><\u002Fdiv>\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase\">{{ modeLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleConfig }}\" style=\"font-size:12px\">Endpoint<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ configOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"border-bottom:2px solid var(--color-divider);padding:20px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:32px\">\n    <div>\n      <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-accent-700);margin-bottom:8px\">Backend endpoint<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <input class=\"input\" value=\"{{ endpointDraft }}\" sc-camel-on-change=\"{{ onEndpointInput }}\" placeholder=\"https://your-api.fly.dev/ask\" style=\"flex:1;min-width:260px;font-size:13px\">\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveEndpoint }}\" style=\"font-size:13px\">Save<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ clearEndpoint }}\" style=\"font-size:13px\">Demo mode<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;line-height:1.5;color:var(--color-neutral-700);margin-top:10px;max-width:70ch\">Saved to this browser only. With no endpoint set the page runs on synthetic timings, clearly badged as demo data — so the demo never dies in front of a judge.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.7;background:var(--color-text);color:var(--color-bg);padding:14px 16px;white-space:pre;overflow-x:auto\">POST {endpoint}\n  multipart: audio=<span style=\"color:var(--color-accent-400)\">blob<\u002Fspan>   or   json: {\"text\": \"...\"}\n→ {\n  transcript, answer, abstained, abstain_gate,\n  citations: [{chunk_id, text, score}],\n  timings_ms: {guard, cache, embed, retrieve,\n    rerank, assemble, generate, verify},\n  total_ms, stt_ms, degraded: []\n}<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:2px;background:var(--color-divider);border:2px solid var(--color-divider);border-top:0\">\n\n    <div style=\"background:var(--color-bg);padding:28px 26px;display:flex;flex-direction:column;gap:22px\">\n      <div>\n        <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">Ask by voice<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleRecord }}\" style=\"{{ micStyle }}\" style-hover=\"filter:brightness(.92)\">\n          <span style=\"display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;opacity:.75\">{{ micKicker }}<\u002Fspan>\n          <span style=\"display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px\">{{ micLabel }}<\u002Fspan>\n        <\u002Fbutton>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <input class=\"input\" value=\"{{ textDraft }}\" sc-camel-on-change=\"{{ onTextInput }}\" sc-camel-on-key-down=\"{{ onTextKey }}\" placeholder=\"…or type a question\" style=\"flex:1;min-width:0;font-size:13px\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ submitText }}\" style=\"font-size:13px\">Ask<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:2px solid var(--color-divider);padding-top:18px\">\n        <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">Transcript<\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.4;font-weight:600;margin-top:8px;min-height:48px;color:{{ transcriptColor }}\">{{ transcriptText }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:2px solid var(--color-divider);padding-top:18px;flex:1\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n          <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">Answer<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-accent-700)\">{{ answerBadge }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.55;margin-top:10px;min-height:60px\">{{ answerText }}<\u002Fdiv>\n        <sc-if value=\"{{ hasCitations }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:1px;background:var(--color-neutral-300);border:1px solid var(--color-neutral-300)\">\n            <sc-for list=\"{{ citations }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"background:var(--color-bg);padding:9px 11px\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:10px;font-weight:800;font-family:ui-monospace,Menlo,monospace;color:var(--color-accent-700)\"><span>{{ c.chunk_id }}<\u002Fspan><span>{{ c.scoreText }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12px;line-height:1.45;color:var(--color-neutral-800);margin-top:4px\">{{ c.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ errorText }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px;border:2px solid var(--color-accent);background:var(--color-accent-100);padding:12px 14px;font-size:13px;line-height:1.5;color:var(--color-accent-800)\">{{ errorText }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--color-bg);position:relative;min-height:560px;display:flex;flex-direction:column\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 22px;border-bottom:1px solid var(--color-neutral-300);flex-wrap:wrap\">\n        <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">Pipeline · drag to orbit, scroll to zoom<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:22px\">\n          <div><span style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">Budget<\u002Fspan> <span style=\"font-size:15px;font-weight:800\">200ms<\u002Fspan><\u002Fdiv>\n          <div><span style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">Measured<\u002Fspan> <span style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;color:{{ totalColor }}\">{{ totalText }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div ref=\"{{ sceneRef }}\" style=\"position:relative;flex:1;min-height:500px;overflow:hidden\">\n        <canvas ref=\"{{ canvasRef }}\" style=\"display:block;width:100%;height:100%\"><\u002Fcanvas>\n        <div ref=\"{{ labelsRef }}\" style=\"position:absolute;inset:0;pointer-events:none\"><\u002Fdiv>\n        <div style=\"position:absolute;left:16px;bottom:14px;font-size:10.5px;line-height:1.5;color:var(--color-neutral-600);max-width:44ch\">Pillar height is stage latency on a compressed scale so 1ms stages stay visible. The waterfall below is linear and true.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section style=\"border:2px solid var(--color-divider);border-top:0;padding:26px 28px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px;margin-bottom:16px\">\n      <div>\n        <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--color-accent-700)\">Per-stage timing · last query<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:4px\">Grey is the budget, solid is measured. Red means the stage went over its line.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:baseline\">\n        <div><span style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">STT<\u002Fspan> <span style=\"font-size:15px;font-weight:800\">{{ sttText }}<\u002Fspan><\u002Fdiv>\n        <div><span style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">Degraded<\u002Fspan> <span style=\"font-size:15px;font-weight:800\">{{ degradedText }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 66px 72px;gap:16px;padding-bottom:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--color-neutral-600)\">\n      <div>Stage<\u002Fdiv><div>0 → 200ms<\u002Fdiv><div style=\"text-align:right\">Budget<\u002Fdiv><div style=\"text-align:right\">Actual<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ stageRows }}\" as=\"s\" hint-placeholder-count=\"8\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 66px 72px;gap:16px;align-items:center;padding:8px 0;border-top:1px solid var(--color-neutral-300)\">\n        <div style=\"font-size:13.5px;font-weight:700\">{{ s.label }}<\u002Fdiv>\n        <div style=\"position:relative;height:14px;background:var(--color-neutral-200)\">\n          <div style=\"position:absolute;left:0;top:0;height:14px;background:var(--color-neutral-300);width:{{ s.budgetPct }}\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;top:0;height:14px;background:{{ s.color }};width:{{ s.actualPct }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;text-align:right;color:var(--color-neutral-600);font-family:ui-monospace,Menlo,monospace\">{{ s.budgetText }}<\u002Fdiv>\n        <div style=\"font-size:13.5px;text-align:right;font-weight:800;font-family:ui-monospace,Menlo,monospace;color:{{ s.color }}\">{{ s.actualText }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 66px 72px;gap:16px;align-items:center;padding:12px 0 0;border-top:2px solid var(--color-divider);margin-top:6px\">\n      <div style=\"font-size:15px;font-weight:800\">Transcript → answer<\u002Fdiv>\n      <div style=\"position:relative;height:16px;background:var(--color-neutral-200)\">\n        <div style=\"position:absolute;left:0;top:0;height:16px;background:{{ totalColor }};width:{{ totalPct }}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;text-align:right;color:var(--color-neutral-600);font-family:ui-monospace,Menlo,monospace\">200<\u002Fdiv>\n      <div style=\"font-size:16px;text-align:right;font-weight:800;font-family:ui-monospace,Menlo,monospace;color:{{ totalColor }}\">{{ totalText }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:20px 4px;font-size:12px;color:var(--color-neutral-700)\">\n    <div>Measured window: server-side <code style=\"background:var(--color-neutral-200);padding:1px 4px\">is_final<\u002Fcode> → last answer token. STT and TTS shown separately, never folded in.<\u002Fdiv>\n    <div>{{ modeNote }}<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst STAGES = [\n  { key: \"guard\",    label: \"Input guardrails\", budget: 2 },\n  { key: \"cache\",    label: \"Semantic cache\",   budget: 1 },\n  { key: \"embed\",    label: \"Query embedding\",  budget: 9 },\n  { key: \"retrieve\", label: \"Hybrid retrieval\", budget: 8 },\n  { key: \"rerank\",   label: \"Cross-encoder\",    budget: 15 },\n  { key: \"assemble\", label: \"Context assembly\", budget: 2 },\n  { key: \"generate\", label: \"Generation\",       budget: 130 },\n  { key: \"verify\",   label: \"Grounding verify\", budget: 3 }\n];\nconst BUDGET_TOTAL = 200;\nconst INK = 0x201e1d, RED = 0xec3013, GHOST = 0xbab6b6;\n\nclass Component extends DCLogic {\n  canvasRef = React.createRef();\n  labelsRef = React.createRef();\n  sceneRef = React.createRef();\n\n  state = {\n    status: \"idle\",\n    endpoint: \"\",\n    endpointDraft: \"\",\n    configOpen: false,\n    textDraft: \"\",\n    transcript: \"\",\n    answer: \"\",\n    abstained: false,\n    abstainGate: null,\n    citations: [],\n    timings: null,\n    totalMs: null,\n    sttMs: null,\n    degraded: [],\n    error: \"\"\n  };\n\n  componentDidMount() {\n    let saved = \"\";\n    try { saved = window.localStorage.getItem(\"vrag_endpoint\") || \"\"; } catch (e) {}\n    this.setState({ endpoint: saved, endpointDraft: saved });\n    if (window.THREE) this.initScene();\n    else {\n      this._onThree = () => this.initScene();\n      window.addEventListener(\"vrag-three-ready\", this._onThree, { once: true });\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._onThree) window.removeEventListener(\"vrag-three-ready\", this._onThree);\n    if (this._ro) this._ro.disconnect();\n    if (this._renderer) this._renderer.dispose();\n    if (this._stream) this._stream.getTracks().forEach(t => t.stop());\n  }\n\n  /* ---------------- 3D ---------------- */\n\n  heightFor(ms) { return 0.28 + Math.pow(Math.max(ms, 0.2), 0.55) * 0.30; }\n\n  pathPos(i) {\n    const n = STAGES.length;\n    const t = i / (n - 1);\n    return { x: -7.2 + t * 14.4, z: Math.sin(t * Math.PI * 1.6) * 3.1 };\n  }\n\n  initScene() {\n    const THREE = window.THREE;\n    const canvas = this.canvasRef.current, host = this.sceneRef.current;\n    if (!THREE || !canvas || !host) return;\n    if (this._renderer || canvas.__vragInit) return;\n    canvas.__vragInit = true;\n    this.labelsRef.current.innerHTML = \"\";\n    this._pillars = [];\n    try {\n      this._build(THREE, canvas, host);\n    } catch (err) {\n      console.error(\"[vrag] 3D init failed\", err);\n      canvas.__vragInit = false;\n      this._renderer = null;\n    }\n  }\n\n  _build(THREE, canvas, host) {\n\n    const w = host.clientWidth || 800, h = host.clientHeight || 520;\n    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.setSize(w, h, false);\n    this._renderer = renderer;\n\n    const scene = new THREE.Scene();\n    this._scene = scene;\n\n    const camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 200);\n    this._camera = camera;\n    this._orbit = { theta: -0.62, phi: 1.06, radius: 26, target: new THREE.Vector3(0, 1.6, 0) };\n    this._applyCamera();\n\n    scene.add(new THREE.AmbientLight(0xffffff, 0.72));\n    const key = new THREE.DirectionalLight(0xffffff, 1.25);\n    key.position.set(6, 14, 9);\n    scene.add(key);\n    const fill = new THREE.DirectionalLight(0xffffff, 0.4);\n    fill.position.set(-8, 5, -6);\n    scene.add(fill);\n\n    const grid = new THREE.GridHelper(40, 40, INK, INK);\n    grid.material.transparent = true;\n    grid.material.opacity = 0.13;\n    scene.add(grid);\n\n    const linkPts = [];\n    this._pillars = [];\n    STAGES.forEach((st, i) => {\n      const p = this.pathPos(i);\n      linkPts.push(new THREE.Vector3(p.x, 0.06, p.z));\n\n      const bh = this.heightFor(st.budget);\n      const ghostGeo = new THREE.BoxGeometry(1.05, bh, 1.05);\n      const ghost = new THREE.LineSegments(\n        new THREE.EdgesGeometry(ghostGeo),\n        new THREE.LineBasicMaterial({ color: GHOST })\n      );\n      ghost.position.set(p.x, bh / 2, p.z);\n      scene.add(ghost);\n      ghostGeo.dispose();\n\n      const mat = new THREE.MeshStandardMaterial({ color: INK, roughness: 0.92, metalness: 0 });\n      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.92, 1, 0.92), mat);\n      bar.position.set(p.x, 0, p.z);\n      bar.scale.y = 0.001;\n      scene.add(bar);\n\n      const edges = new THREE.LineSegments(\n        new THREE.EdgesGeometry(new THREE.BoxGeometry(0.925, 1, 0.925)),\n        new THREE.LineBasicMaterial({ color: INK, transparent: true, opacity: 0.55 })\n      );\n      edges.position.copy(bar.position);\n      edges.scale.y = 0.001;\n      scene.add(edges);\n\n      const label = document.createElement(\"div\");\n      label.className = \"vrag-label\";\n      const lift = (i % 3) * 26;\n      label.innerHTML =\n        '<div style=\"background:#f3f2f2;border-left:2px solid #ec3013;padding:2px 7px\">' +\n          '<div style=\"font-size:9.5px;letter-spacing:.08em;font-weight:800;color:#7d7979\">' + String(i + 1).padStart(2, \"0\") + \"<\u002Fdiv>\" +\n          '<div style=\"font-size:12px;font-weight:800;color:#201e1d;line-height:1.15\">' + st.label + \"<\u002Fdiv>\" +\n          '<div class=\"vrag-ms\" style=\"font-size:11px;font-weight:700;font-family:ui-monospace,Menlo,monospace;color:#7d7979\">— ms<\u002Fdiv>' +\n        \"<\u002Fdiv>\" +\n        '<div style=\"width:1px;height:' + lift + 'px;background:#bab6b6;margin:0 auto\"><\u002Fdiv>';\n      this.labelsRef.current.appendChild(label);\n\n      this._pillars.push({ st, bar, edges, mat, label, target: 0.001, current: 0.001, base: bh });\n    });\n\n    const link = new THREE.Line(\n      new THREE.BufferG t.addEventListener(\"wheel\", e => {\n      e.preventDefault();\n      this._orbit.radius = Math.min(46, Math.max(12, this._orbit.radius + e.deltaY * 0.02));\n      this._applyCamera();\n    }, { passive: false });\n  }\n\n  _resize() {\n    const host = this.sceneRef.current;\n    if (!host || !this._renderer) return;\n    const w = host.clientWidth, h = host.clientHeight;\n    if (!w || !h) return;\n    this._renderer.setSize(w, h, false);\n    this._camera.aspect = w / h;\n    this._camera.updateProjectionMatrix();\n  }\n\n  _loop = () => {\n    try { this._frame(); }\n    catch (err) { console.error(\"[vrag] frame error\", err); this._loopBroken = true; }\n    if (!this._loopBroken) this._raf = requestAnimationFrame(this._loop);\n  };\n\n  _frame() {\n    const THREE = window.THREE;\n    if (!this._renderer || !THREE) return;\n\n    if (this._idleSpin) { this._orbit.theta += 0.0016; this._applyCamera(); }\n\n    for (const p of this._pillars) {\n      p.current += (p.target - p.current) * 0.14;\n      p.bar.scale.y = p.current;\n      p.bar.position.y = p.current / 2;\n      p.edges.scale.y = p.current;\n      p.edges.position.y = p.current / 2;\n    }\n\n    if (this._flight) {\n      const f = this._flight, now = performance.now();\n      const el = now - f.start;\n      if (el >= f.total) {\n        this._packet.visible = false;\n        this._flight = null;\n        this._pillars.forEach(p => p.mat.color.setHex(INK));\n      } else {\n        let acc = 0, idx = 0, local = 0;\n        for (let i = 0; i < f.segs.length; i++) {\n          if (el < acc + f.segs[i]) { idx = i; local = (el - acc) / f.segs[i]; break; }\n          acc += f.segs[i];\n        }\n        const a = this._linkPts[Math.min(idx, this._linkPts.length - 1)];\n        const b = this._linkPts[Math.min(idx + 1, this._linkPts.length - 1)];\n        this._packet.position.set(\n          a.x + (b.x - a.x) * local,\n          0.34 + Math.sin(local * Math.PI) * 0.5,\n          a.z + (b.z - a.z) * local\n        );\n        this._packet.rotation.y += 0.06;\n        this._pillars.forEach((p, i) => p.mat.color.setHex(i === idx ? RED : INK));\n        if (f.stopAt != null && idx >= f.stopAt) {\n          this._packet.material.color.setHex(RED);\n          this._packet.visible = true;\n          this._flight = null;\n          this._pillars.forEach((p, i) => p.mat.color.setHex(i === f.stopAt ? RED : INK));\n        }\n      }\n    }\n\n    const host = this.sceneRef.current;\n    if (host) {\n      const w = host.clientWidth, h = host.clientHeight, v = new THREE.Vector3();\n      for (const p of this._pillars) {\n        v.set(p.bar.position.x, Math.max(p.current, p.base) + 0.4, p.bar.position.z).project(this._camera);\n        const x = Math.min(w - 58, Math.max(58, (v.x * 0.5 + 0.5) * w));\n        const y = Math.min(h - 6, Math.max(96, (-v.y * 0.5 + 0.5) * h));\n        p.label.style.left = x + \"px\";\n        p.label.style.top = y + \"px\";\n        p.label.style.opacity = v.z > 1 ? 0 : 1;\n      }\n    }\n    this._renderer.render(this._scene, this._camera);\n  }\n\n  applyTimings(timings, fly) {\n    if (!this._pillars) return;\n    this._pillars.forEach(p => {\n      const ms = timings ? timings[p.st.key] : null;\n      p.target = ms != null ? this.heightFor(ms) : 0.001;\n      const el = p.label.querySelector(\".vrag-ms\");\n      if (el) {\n        el.textContent = ms != null ? ms.toFixed(1) + \" ms\" : \"— ms\";\n        el.style.color = ms != null && ms > p.st.budget * 1.15 ? \"#ae1800\" : \"#7d7979\";\n      }\n    });\n    if (fly && timings) {\n      const segs = STAGES.slice(0, -1).map((s, i) => {\n        const ms = timings[STAGES[i + 1].key] || 1;\n        return 220 + Math.min(900, ms * 5);\n      });\n      this._flight = {\n        start: performance.now(),\n        segs,\n        total: segs.reduce((a, b) => a + b, 0),\n        stopAt: this.state.abstainGate != null ? this.state.abstainGate : null\n      };\n      this._packet.material.color.setHex(RED);\n      this._packet.visible = true;\n    }\n  }\n\n  /* ---------------- pipeline calls ---------------- */\n\n  async toggleRecord() {\n    if (this.state.status === \"recording\") {\n      this._recorder && this._recorder.stop();\n      return;\n    }\n    if (this.state.status === \"processing\") return;\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      this._stream = stream;\n      const mime = [\"audio/webm;codecs=opus\", \"audio/webm\", \"audio/mp4\"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || \"\";\n      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);\n      this._recorder = rec;\n      const chunks = [];\n      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };\n      rec.onstop = () => {\n        stream.getTracks().forEach(t => t.stop());\n        this._stream = null;\n        this.send({ audio: new Blob(chunks, { type: mime || \"audio/webm\" }) });\n      };\n      rec.start();\n      this.setState({ status: \"recording\", error: \"\", answer: \"\", transcript: \"\", citations: [], abstained: false });\n      this._t0 = performance.now();\n      this._maxRec = setTimeout(() => { if (rec.state === \"recording\") rec.stop(); }, 15000);\n    } catch (err) {\n      this.setState({ status: \"idle\", error: \"Microphone blocked — \" + (err && err.message ? err.message : \"permission denied\") + \". Use the text field below, it runs the identical pipeline.\" });\n    }\n  }\n\n  submitText() {\n    const q = (this.state.textDraft || \"\").trim();\n    if (!q || this.state.status === \"processing\") return;\n    this.setState({ transcript: q, textDraft: \"\" });\n    this.send({ text: q });\n  }\n\n  async send(payload) {\n    if (this._maxRec) clearTimeout(this._maxRec);\n    this.setState({ status: \"processing\", error: \"\", answer: \"\", citations: [], abstained: false, abstainGate: null });\n    const ep = this.state.endpoint;\n    try {\n      let data;\n      if (ep) {\n        let res;\n        if (payload.audio) {\n          const fd = new FormData();\n          fd.append(\"audio\", payload.audio, \"query.webm\");\n          res = await fetch(ep, { method: \"POST\", body: fd });\n        } else {\n          res = await fetch(ep, {\n            method: \"POST\",\n            headers: { \"Content-Type\": \"application/json\" },\n            body: JSON.stringify({ text: payload.text })\n          });\n        }\n        if (!res.ok) throw new Error(\"HTTP \" + res.status);\n        data = await res.json();\n      } else {\n        data = await this.simulate(payload);\n      }\n      this.receive(data);\n    } catch (err) {\n      this.setState({\n        status: \"idle\",\n        error: \"Backend unreachable — \" + (err && err.message ? err.message : \"request failed\") + \". Clear the endpoint to fall back to demo data.\"\n      });\n    }\n  }\n\n  receive(d) {\n    const t = d.timings_ms || {};\n    const total = d.total_ms != null ? d.total_ms : STAGES.reduce((a, s) => a + (t[s.key] || 0), 0);\n    const gateIndex = { gate1: 0, gate2: 3, gate3: 6, gate4: 7 };\n    const stopAt = d.abstained ? (gateIndex[d.abstain_gate] != null ? gateIndex[d.abstain_gate] : 3) : null;\n    this.setState({\n      status: \"done\",\n      transcript: d.transcript || this.state.transcript,\n      answer: d.answer || \"\",\n      abstained: !!d.abstained,\n      abstainGate: stopAt,\n      citations: Array.isArray(d.citations) ? d.citations.slice(0, 3) : [],\n      timings: t,\n      totalMs: total,\n      sttMs: d.stt_ms != null ? d.stt_ms : null,\n      degraded: Array.isArray(d.degraded) ? d.degraded : []\n    }, () => this.applyTimings(t, true));\n  }\n\n  async simulate(payload) {\n    await new Promise(r => setTimeout(r, 620));\n    const j = (base, spread) => Math.round((base + (Math.random() - 0.5) * spread) * 10) / 10;\n    const q = (payload.text || \"\").toLowerCase();\n    const offTopic = /weather|stock|bitcoin|who are you|ignore|password/.test(q);\n    const t = {\n      guard: j(2, 1), cache: j(0.9, .5), embed: j(9.2, 3), retrieve: j(7.6, 3),\n      rerank: j(14.8, 5), assemble: j(1.9, .8), generate: j(128, 34), verify: j(3.1, 1.4)\n    };\n    if (offTopic) {\n      [\"rerank\", \"assemble\", \"generate\", \"verify\"].forEach(k => delete t[k]);\n      return {\n        transcript: payload.text || \"…spoken query…\",\n        answer: \"I don't have anything on that in this corpus.\",\n        abstained: true, abstain_gate: \"gate2\",\n        citations: [], timings_ms: t,\n        total_ms: Math.round((t.guard + t.cache + t.embed + t.retrieve) * 10) / 10,\n        stt_ms: j(240, 90), degraded: []\n      };\n    }\n    const total = Math.round(Object.values(t).reduce((a, b) => a + b, 0) * 10) / 10;\n    return {\n      transcript: payload.text || \"…spoken query…\",\n      answer: \"Demo response — no endpoint configured. Wire your /ask route and every number on this page becomes real.\",\n      abstained: false,\n      citations: [\n        { chunk_id: \"s8:doc41822:3\", text: \"Retrieved passage would appear here with its fused score.\", score: 0.83 },\n        { chunk_id: \"s3:doc41822:7\", text: \"Second supporting chunk, deduped to its parent passage.\", score: 0.71 }\n      ],\n      timings_ms: t, total_ms: total, stt_ms: j(240, 90),\n      degraded: Math.random() > 0.82 ? [\"rerank\"] : []\n    };\n  }\n\n  /* ---------------- config ---------------- */\n\n  saveEndpoint() {\n    const v = (this.state.endpointDraft || \"\").trim();\n    try { v ? window.localStorage.setItem(\"vrag_endpoint\", v) : window.localStorage.removeItem(\"vrag_endpoint\"); } catch (e) {}\n    this.setState({ endpoint: v, configOpen: false, error: \"\" });\n  }\n\n  clearEndpoint() {\n    try { window.localStorage.removeItem(\"vrag_endpoint\"); } catch (e) {}\n    this.setState({ endpoint: \"\", endpointDraft: \"\", configOpen: false, error: \"\" });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const live = !!s.endpoint;\n    const rec = s.status === \"recording\";\n    const proc = s.status === \"processing\";\n\n    const micStyle = [\n      \"width:100%\", \"margin-top:10px\", \"padding:22px 20px\", \"border:2px solid var(--color-text)\",\n      \"text-align:left\", \"cursor:\" + (proc ? \"wait\" : \"pointer\"), \"font-family:var(--font-heading)\",\n      \"background:\" + (rec ? \"var(--color-accent)\" : \"var(--color-text)\"),\n      \"color:var(--color-bg)\",\n      rec ? \"animation:vragPulse 1.1s ease-in-out infinite\" : \"\"\n    ].filter(Boolean).join(\";\");\n\n    const rows = STAGES.map(st => {\n      const ms = s.timings ? s.timings[st.key] : null;\n      const over = ms != null && ms > st.budget * 1.15;\n      return {\n        label: st.label,\n        budgetText: String(st.budget),\n        actualText: ms != null ? ms.toFixed(1) : \"—\",\n        budgetPct: (st.budget / BUDGET_TOTAL * 100) + \"%\",\n        actualPct: (ms != null ? Math.min(100, ms / BUDGET_TOTAL * 100) : 0) + \"%\",\n        color: over ? \"var(--color-accent)\" : \"var(--color-text)\"\n      };\n    });\n\n    const total = s.totalMs;\n    const overBudget = total != null && total > BUDGET_TOTAL;\n\n    return {\n      canvasRef: this.canvasRef,\n      labelsRef: this.labelsRef,\n      sceneRef: this.sceneRef,\n\n      modeLabel: live ? \"Live backend\" : \"Demo data\",\n      statusDot: live ? \"var(--color-accent)\" : \"var(--color-neutral-500)\",\n      modeNote: live ? \"Connected to \" + s.endpoint : \"No endpoint set — timings below are synthetic.\",\n\n      configOpen: s.configOpen,\n      toggleConfig: () => this.setState({ configOpen: !s.configOpen }),\n      endpointDraft: s.endpointDraft,\n      onEndpointInput: e => this.setState({ endpointDraft: e.target.value }),\n      saveEndpoint: () => this.saveEndpoint(),\n      clearEndpoint: () => this.clearEndpoint(),\n\n      toggleRecord: () => this.toggleRecord(),\n      micKicker: rec ? \"Recording · tap to stop\" : proc ? \"Working\" : \"Tap to speak\",\n      micLabel: rec ? \"Listening…\" : proc ? \"Running pipeline\" : \"Ask a question\",\n      micStyle,\n\n      textDraft: s.textDraft,\n      onTextInput: e => this.setState({ textDraft: e.target.value }),\n      onTextKey: e => { if (e.key === \"Enter\") this.submitText(); },\n      submitText: () => this.submitText(),\n\n      transcriptText: s.transcript || (rec ? \"Listening…\" : \"Nothing yet.\"),\n      transcriptColor: s.transcript ? \"var(--color-text)\" : \"var(--color-neutral-500)\",\n\n      answerText: s.answer || (proc ? \"…\" : \"Ask something to see the pipeline run.\"),\n      answerBadge: s.abstained ? \"Abstained · gate \" + (s.abstainGate === 0 ? \"1\" : s.abstainGate === 3 ? \"2\" : \"4\") : s.answer ? \"Grounded\" : \"\",\n      hasCitations: s.citations.length > 0,\n      citations: s.citations.map(c => ({\n        chunk_id: c.chunk_id || \"—\",\n        text: c.text || \"\",\n        scoreText: c.score != null ? Number(c.score).toFixed(2) : \"\"\n      })),\n      errorText: s.error,\n\n      stageRows: rows,\n      totalText: total != null ? total.toFixed(1) + \"ms\" : \"—\",\n      totalPct: (total != null ? Math.min(100, total / BUDGET_TOTAL * 100) : 0) + \"%\",\n      totalColor: overBudget ? \"var(--color-accent)\" : \"var(--color-text)\",\n      sttText: s.sttMs != null ? s.sttMs.toFixed(0) + \"ms\" : \"—\",\n      degradedText: s.degraded.length ? s.degraded.join(\", \") : \"none\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
